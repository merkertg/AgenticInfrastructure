[project]
name = "agentic-infrastructure"
version = "0.1.0"
description = "A staged learning project for shared corporate memory for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.142.2,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1.4,<2.2",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    # The resolved Starlette TestClient prefers HTTPX2.
    "httpx2>=2.13.1,<3",
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16.10,<0.17",
]

guide = ["reportlab==4.4.9", "pillow>=13.0.0,<14"]

[tool.uv]
# Reuse the portfolio's two-week release cutoff; uv.lock pins exact versions.
exclude-newer = "2026-10-10T00:00:00Z"

# Narrow security exception for the PDF-only Pillow dependency.
# https://github.com/python-pillow/Pillow/releases/tag/13.0.0
[tool.uv.exclude-newer-package]
pillow = "2026-10-17T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "postgres: requires TEST_DATABASE_URL pointing to a disposable local database ending in _test",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true

# Guide flowables subclass ReportLab classes, which mypy sees as Any.
[[tool.mypy.overrides]]
module = ["scripts.build_guide"]
disallow_subclassing_any = false
