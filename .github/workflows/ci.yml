name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # The same index digest as compose.yaml; a tag can later move.
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic-local
          POSTGRES_DB: agentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked mypy app tests scripts migrations

      - name: Run tests without PostgreSQL
        run: uv run --locked pytest -m 'not postgres'

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agentic:agentic-local@127.0.0.1:5432/agentic_test
        run: uv run --locked pytest -m postgres

      - name: Check documentation links
        run: uv run --locked python scripts/check_docs.py

      - name: Check locked resolution
        run: uv lock --check --offline

      - name: Check whitespace
        run: git diff --check

  container-lab:
    name: Container laboratory and evaluations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      # Builds the image, starts a disposable Compose project, runs evaluations,
      # the audit and permission-leak drills, and a backup and restore.
      - name: Run the full container scenario
        run: uv run --locked python -m scripts.compose_lab

      # The report holds counts, case IDs and timings; no tokens or passwords.
      - name: Show the scenario report
        if: always()
        run: cat var/reports/agentic-stage08.json || true

      # Both lab images are scanned by a digest-pinned Trivy image rather than a
      # mutable action tag. HIGH and CRITICAL findings with a released fix fail
      # the job; findings without a fix are printed but do not block.
      - name: Scan images for known vulnerabilities
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/cache" \
              "$TRIVY_IMAGE" --cache-dir /cache image --quiet --scanners vuln "$@"
          }
          for attempt in 1 2 3; do
            if scan --download-db-only; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "Trivy vulnerability database download failed 3 times" >&2
              exit 1
            fi
            sleep 20
          done
          status=0
          for image in agentic-infrastructure:local agentic-infrastructure-db:local; do
            scan --skip-db-update --severity HIGH,CRITICAL "$image"
            scan --skip-db-update --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image" || status=1
          done
          exit "$status"
